[project]
name = "digital-twin"
version = "0.1.0"
description = "Research and prototype workspace for an instructor digital twin teaching system."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.26,<5.0",
  "langgraph>=1.2.11,<2.0",
  "langgraph-checkpoint-sqlite==3.1.1",
  "litellm>=1.97.0,<2.0",
  "pydantic>=2.13.4,<3.0",
  "pymupdf>=1.28.2,<2.0",
  "python-dotenv>=1.2.3,<2.0",
  "uvicorn[standard]>=0.52.3,<1.0",
]

[project.optional-dependencies]
retrieval-benchmark = [
    "fastembed==0.8.0",
    "open-clip-torch>=3.3,<4.0",
    "sentence-transformers==6.0.0",
    "torch==2.13.0",
    "transformers==5.15.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.10,<3.0",
  "matplotlib>=3.11.1",
  "pip-audit==2.10.1",
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
