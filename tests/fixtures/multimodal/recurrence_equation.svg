<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <rect width="720" height="420" fill="#fff"/>
  <text x="42" y="55" font-family="sans-serif" font-size="27" font-weight="700">Divide-and-conquer recurrence</text>
  <text x="360" y="190" font-family="serif" font-size="46" text-anchor="middle">T(n) = 2T(n/2) + n</text>
  <text x="360" y="265" font-family="serif" font-size="34" text-anchor="middle">T(1) = 1</text>
  <text x="360" y="335" font-family="sans-serif" font-size="24" text-anchor="middle">two subproblems of half size plus linear combine work</text>
</svg>
