name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.9.26

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit resolved dependencies
        run: npm run audit:dependencies

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y librsvg2-bin
          rsvg-convert --version

      - name: Prepare public evaluation sources
        # Source-derived build regressions require these exact public revisions.
        # Preparation does not execute or rescore historical evaluations.
        run: npm run setup:evaluation-sources

      - name: Check SVG integration prerequisites
        run: >-
          uv run pytest -q
          tests/test_academic_factual_qa_visual_checkpoint.py
          tests/test_course_digital_twin_nonhuman_supplements.py::test_oversized_svg_is_rasterized_within_memory_bound

      - name: Verify repository
        run: npm run check
